<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}" />
  <style>
    body{ display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .login-card{
      width:min(400px, 100%);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: var(--shadow);
      padding: 32px 26px;
    }
    .login-card h1{ font-size:22px; margin:0 0 6px; }
    .login-card .sub{ margin:0 0 20px; }
    .login-card form{ display:grid; gap:14px; }
    .login-card label{ margin-bottom:4px; }
    .login-card .submit{
      margin-top:6px;
      padding:12px 14px;
      border-radius:999px;
      border:0;
      color:#07142f;
      font-weight:900;
      letter-spacing:.12em;
      text-transform:uppercase;
      cursor:pointer;
      background: linear-gradient(90deg, var(--yellow), var(--yellow-2));
      box-shadow: 0 18px 46px rgba(255,204,33,.14);
      transition: transform .06s ease, filter .15s ease;
    }
    .login-card .submit:active{ transform:translateY(1px); }
    .login-error{
      color:#ffe0e0;
      background:rgba(255,107,107,.12);
      border:1px solid rgba(255,107,107,.25);
      padding:10px 12px;
      border-radius:14px;
      font-size:13px;
    }
    .back-link{
      display:block;
      text-align:center;
      margin-top:16px;
      color:rgba(238,244,255,.65);
      font-size:12px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand" style="margin-bottom:18px;">
      <span class="mark" aria-hidden="true"></span> Admin
    </div>

    <h1>Login</h1>
    <p class="sub">Enter your credentials to access the admin panel.</p>

    {% if error %}
    <div class="login-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('admin.login') }}">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" placeholder="Username" autocomplete="username" required />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required />
      </div>

      <button class="submit" type="submit">Log in</button>
    </form>

    <a class="back-link" href="{{ url_for('main.index') }}">← Back to site</a>
  </div>
</body>
</html>
